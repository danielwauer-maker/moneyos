{% extends "base.html" %}
{% block content %}
<div class="intro"><div><h2>Lokale Betriebsdiagnose</h2><p>Nur Systemzustände, keine privaten Transaktionsinhalte.</p></div></div>
<article class="panel table-panel"><table><thead><tr><th>Prüfung</th><th>Status</th><th>Details</th></tr></thead><tbody>
{% for check in checks %}<tr><td>{{ check.name }}</td><td><span class="badge {% if check.ok %}success{% else %}warning{% endif %}">{{ 'OK' if check.ok else 'Hinweis' }}</span></td><td>{{ check.detail }}</td></tr>{% endfor %}
</tbody></table></article>
{% endblock %}
