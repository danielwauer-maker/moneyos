services:
  moneyos:
    build: .
    container_name: moneyos
    ports:
      - "127.0.0.1:8084:8000"

    environment:
      MONEYOS_DEMO_MODE: "false"
      MONEYOS_PRIVATE_DATABASE_URL: "sqlite:////app/data/private/profiles/private/moneyos.db"

    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs

    restart: unless-stopped

    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
      ]
